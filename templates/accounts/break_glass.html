<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial System - Emergency Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }
        p {
            color: #666;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-size: 0.875rem;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            border: 1px solid #f5c6cb;
            font-size: 0.875rem;
            display: none;
        }
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emergency Access</h1>
        <p>This is a restricted access point for platform administrators only.</p>
        
        <div class="error" id="error"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" id="submitBtn">Request OTP</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorDiv = document.getElementById('error');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Validating...';
            
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/v1/auth/break-glass-login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    sessionStorage.setItem('break_glass_user_id', data.user_id);
                    showOtpForm(data.user_id);
                } else {
                    errorDiv.textContent = data.detail || 'Login failed';
                    errorDiv.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Request OTP';
                }
            } catch (err) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Request OTP';
            }
        });
        
        function showOtpForm(userId) {
            form.innerHTML = `
                <div class="form-group">
                    <label for="otp">Enter OTP sent to your email</label>
                    <input type="text" id="otp" name="otp" required autocomplete="one-time-code" maxlength="6" pattern="\\d{6}">
                </div>
                <button type="submit" id="submitBtn">Verify & Login</button>
                <div class="error" id="error"></div>
            `;
            
            const newSubmitBtn = document.getElementById('submitBtn');
            const newErrorDiv = document.getElementById('error');
            
            const newForm = document.getElementById('loginForm');
            newForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                newErrorDiv.classList.remove('show');
                newSubmitBtn.disabled = true;
                newSubmitBtn.textContent = 'Verifying...';
                
                const otp = document.getElementById('otp').value.trim();
                
                try {
                    const response = await fetch('/api/v1/auth/verify-otp/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            user_id: userId,
                            otp,
                            break_glass: true
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // Store tokens temporarily and redirect with a special flag
                        sessionStorage.setItem('break_glass_access', data.access);
                        sessionStorage.setItem('break_glass_refresh', data.refresh);
                        sessionStorage.setItem('break_glass_user', JSON.stringify(data.user));
                        sessionStorage.removeItem('break_glass_user_id');
                        
                        // Redirect to frontend with a special flag
                        window.location.href = '{{ FRONTEND_URL }}?break_glass=true';
                    } else {
                        newErrorDiv.textContent = data.detail || 'Verification failed';
                        newErrorDiv.classList.add('show');
                        newSubmitBtn.disabled = false;
                        newSubmitBtn.textContent = 'Verify & Login';
                    }
                } catch (err) {
                    newErrorDiv.textContent = 'Network error. Please try again.';
                    newErrorDiv.classList.add('show');
                    newSubmitBtn.disabled = false;
                    newSubmitBtn.textContent = 'Verify & Login';
                }
            });
        }
    </script>
</body>
</html>
