services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_db
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  financial-backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && daphne financial_system.asgi:application -b 0.0.0.0 -p 8001"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-insecure-dev-secret-change-me}
      - DATABASE_URL=${DATABASE_URL:-postgres://financial_user:financial_password@db:5432/financial_db}
      - AUTH_MODE=${AUTH_MODE:-native}
      - FINANCIAL_INTERNAL_IDP_API_KEY=${FINANCIAL_INTERNAL_IDP_API_KEY:-}
      - DMS_INTERNAL_IDP_API_KEY=${DMS_INTERNAL_IDP_API_KEY:-}
      - DMS_INTERNAL_API_BASE_URL=${DMS_INTERNAL_API_BASE_URL:-http://backend:8000/api/v1/internal/idp}
      - DMS_PUBLIC_URL=${DMS_PUBLIC_URL:-http://localhost:3000}
      - INVENTORY_PUBLIC_URL=${INVENTORY_PUBLIC_URL:-http://localhost:3002}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8080}
      - KEYCLOAK_INTERNAL_URL=${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-idp-dev}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-financial-client}
      - OIDC_OP_ISSUER=${OIDC_OP_ISSUER:-http://localhost:8080/realms/idp-dev}
      - OIDC_OP_JWKS_ENDPOINT=${OIDC_OP_JWKS_ENDPOINT:-http://keycloak:8080/realms/idp-dev/protocol/openid-connect/certs}
      - REDIS_URL=${REDIS_URL:-redis://:redis_password@redis:6379/0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,financial-backend,frontend,nginx}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - TZ=Africa/Nairobi
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - idp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - financial-backend
    networks:
      - default

volumes:
  postgres_data:
  redis_data:

networks:
  default: {}
  idp-network:
    external: true
