services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_db
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  financial-backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn financial_system.wsgi:application --bind 0.0.0.0:8001 --workers 4 --timeout 120 --access-logfile -"]
    env_file: .env
    environment:
      # fix #8C: DEBUG must be set explicitly in .env — no hardcoded True here
      - DATABASE_URL=${DATABASE_URL:-postgres://financial_user:financial_password@db:5432/financial_db}
      - REDIS_URL=${REDIS_URL:-redis://:redis_password@redis:6379/0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,financial-backend,frontend,nginx}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - TZ=Africa/Nairobi
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - idp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - financial-backend
    networks:
      - default

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:

networks:
  default: {}
  idp-network:
    external: true
