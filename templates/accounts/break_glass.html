<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Access — Financial System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      color: #e2e8f0;
    }
    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: .1em;
      color: #f59e0b;
      border: 1px solid #f59e0b44;
      border-radius: 4px;
      padding: 2px 8px;
      display: inline-block;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.3rem; color: #f1f5f9; margin-bottom: .35rem; }
    p  { font-size: 0.83rem; color: #94a3b8; margin-bottom: 1.5rem; }
    label { display: block; font-size: .8rem; font-weight: 600; color: #cbd5e1; margin-bottom: .35rem; }
    input {
      width: 100%; padding: .65rem .85rem;
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      color: #e2e8f0; font-size: .95rem; margin-bottom: 1rem;
      transition: border-color .2s;
    }
    input:focus { outline: none; border-color: #f59e0b; }
    button {
      width: 100%; padding: .7rem;
      background: #f59e0b; color: #0f172a;
      border: none; border-radius: 6px;
      font-size: .95rem; font-weight: 700; cursor: pointer;
      transition: background .2s;
    }
    button:hover:not(:disabled) { background: #d97706; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .error {
      background: #7f1d1d44; color: #fca5a5;
      border: 1px solid #7f1d1d; border-radius: 6px;
      padding: .65rem .9rem; font-size: .82rem; margin-bottom: 1rem;
      display: none;
    }
    .error.show { display: block; }
    .footer { margin-top: 1.2rem; font-size: .72rem; color: #475569; text-align: center; }
  </style>
</head>
<body>
<div class="card">
  <span class="badge">EMERGENCY ACCESS</span>
  <h1>Platform Administrator Login</h1>
  <p>Restricted to platform administrators. All activity is logged and audited.</p>

  <div class="error" id="errorBox"></div>

  <form id="credForm">
    <label for="bg-email">Email</label>
    <input type="email" id="bg-email" required autocomplete="username" placeholder="admin@organisation.com">
    <label for="bg-password">Password</label>
    <input type="password" id="bg-password" required autocomplete="current-password" placeholder="••••••••••">
    <button type="submit" id="credBtn">Request OTP</button>
  </form>

  <div class="footer">Session activity is logged under financial audit compliance.</div>
</div>

<script>
  const API = '/api/v1/auth';
  const FRONTEND = '{{ FRONTEND_URL }}';

  function showError(msg) {
    const el = document.getElementById('errorBox');
    el.textContent = msg;
    el.classList.add('show');
  }
  function clearError() { document.getElementById('errorBox').classList.remove('show'); }

  /* ── Step 1: credentials ─────────────────────────── */
  document.getElementById('credForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    const btn = document.getElementById('credBtn');
    btn.disabled = true;
    btn.textContent = 'Sending OTP…';

    const email    = document.getElementById('bg-email').value.trim().toLowerCase();
    const password = document.getElementById('bg-password').value;

    try {
      const res  = await fetch(`${API}/break-glass-login/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) { showError(data.detail || 'Login failed.'); btn.disabled = false; btn.textContent = 'Request OTP'; return; }
      showOtpStep(data.user_id);
    } catch {
      showError('Network error. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Request OTP';
    }
  });

  /* ── Step 2: OTP ─────────────────────────────────── */
  function showOtpStep(userId) {
    const card = document.querySelector('.card');
    card.querySelector('h1').textContent = 'Enter OTP';
    card.querySelector('p').textContent  = 'Enter the 6-digit code sent to your email. It expires in 10 minutes.';
    card.querySelector('#credForm').remove();
    clearError();

    const form = document.createElement('form');
    form.id = 'otpForm';
    form.innerHTML = `
      <label for="bg-otp">6-digit code</label>
      <input type="text" id="bg-otp" maxlength="6" pattern="\\d{6}" required autocomplete="one-time-code" placeholder="000000" inputmode="numeric">
      <button type="submit" id="otpBtn">Verify &amp; Continue</button>
    `;
    card.querySelector('.footer').before(form);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const btn = document.getElementById('otpBtn');
      btn.disabled = true;
      btn.textContent = 'Verifying…';
      const otp = document.getElementById('bg-otp').value.trim();

      try {
        const res  = await fetch(`${API}/break-glass-verify-otp/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, otp }),
        });
        const data = await res.json();
        if (!res.ok) { showError(data.detail || 'Verification failed.'); btn.disabled = false; btn.textContent = 'Verify & Continue'; return; }

        /* fix #5: pass signed token via URL — no cross-origin sessionStorage */
        window.location.href = `${FRONTEND}/auth/break-glass?token=${encodeURIComponent(data.break_glass_token)}`;
      } catch {
        showError('Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Verify & Continue';
      }
    });
  }
</script>
</body>
</html>
